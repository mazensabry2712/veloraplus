name: Generate Composer Lock

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Update Brick Money lock
        run: composer update brick/money --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Upload composer lock
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
