name: Generate Composer Lock

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Update Brick Money lock
        run: composer update brick/money --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts

      - name: Commit composer lock when changed
        shell: bash
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: update composer.lock"
          git push

      - name: Upload composer lock
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
